name: AppImage

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: appimage-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect version increase
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          new=$(jq -r .version package.json)
          before="${{ github.event.before }}"
          remote_old=""
          if [ "$before" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${before}:package.json" 2>/dev/null; then
            remote_old=$(git show "${before}:package.json" | jq -r .version)
          fi
          # Newest ancestor whose version differs from HEAD. Needed when the branch arrives in one push.
          history_old=""
          while read -r commit; do
            candidate=$(git show "${commit}:package.json" 2>/dev/null | jq -r .version || true)
            if [ -n "$candidate" ] && [ "$candidate" != "$new" ]; then
              history_old=$candidate
              break
            fi
          done < <(git rev-list HEAD)
          version_gt() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }
          publish=false
          if [ -n "$remote_old" ] && version_gt "$new" "$remote_old"; then
            publish=true
            echo "Version raised on the remote: $remote_old -> $new"
          elif [ -n "$history_old" ] && version_gt "$new" "$history_old" \
            && ! gh release view "v${new}" >/dev/null 2>&1; then
            publish=true
            echo "Version $new is higher than $history_old and has no GitHub release yet"
          else
            echo "No version increase for $new. Skipping build and release."
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Lint
        if: steps.version.outputs.publish == 'true'
        run: npm run lint

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test

      - name: Build AppImage
        if: steps.version.outputs.publish == 'true'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        # On GitHub Actions electron-builder publishes by itself and then demands GH_TOKEN.
        # The release is created in the release job, so this build only writes the AppImage.
        run: npm run build -- --publish never

      - name: Upload AppImage
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: appimage
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh release create "$tag" release/*.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --target "${GITHUB_SHA}" \
            --title "$tag" \
            --notes "AppImage ${tag}."
